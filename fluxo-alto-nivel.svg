<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="title description">
  <title id="title">Fluxo de alto nível do AICare</title>
  <desc id="description">A pessoa usa o aplicativo móvel, que troca dados com a API do backend. O backend aplica as regras do sistema e consulta ou atualiza o banco SQLite.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; }
      .page { fill: #f3f6f8; }
      .heading { fill: #19384c; font-size: 28px; font-weight: 700; }
      .subheading { fill: #637784; font-size: 15px; }
      .box { stroke-width: 2; }
      .person { fill: #fff; stroke: #cbd9e1; }
      .app { fill: #eaf5fb; stroke: #a9ccdf; }
      .backend { fill: #edf7f0; stroke: #b6d5bf; }
      .database { fill: #fff5e3; stroke: #e3c88e; }
      .name { fill: #24485e; font-size: 21px; font-weight: 700; }
      .detail { fill: #617581; font-size: 14px; }
      .arrow { fill: none; stroke: #477a96; stroke-width: 3; }
      .arrow-label { fill: #4a6372; font-size: 13px; font-weight: 600; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M1 1 L9 5 L1 9" fill="none" stroke="#477a96" stroke-width="1.7"/>
    </marker>
    <marker id="arrow-start" markerWidth="10" markerHeight="10" refX="1" refY="5" orient="auto">
      <path d="M9 1 L1 5 L9 9" fill="none" stroke="#477a96" stroke-width="1.7"/>
    </marker>
  </defs>

  <rect class="page" width="1200" height="460"/>
  <text class="heading" x="600" y="58" text-anchor="middle">Como o AICare funciona</text>
  <text class="subheading" x="600" y="88" text-anchor="middle">Visão geral do caminho dos dados</text>

  <rect class="box person" x="50" y="160" width="210" height="150"/>
  <text class="name" x="155" y="216" text-anchor="middle">Pessoa</text>
  <text class="detail" x="155" y="248" text-anchor="middle">Usa o aplicativo</text>
  <text class="detail" x="155" y="270" text-anchor="middle">e informa os dados</text>

  <rect class="box app" x="340" y="160" width="230" height="150"/>
  <text class="name" x="455" y="216" text-anchor="middle">Aplicativo</text>
  <text class="detail" x="455" y="248" text-anchor="middle">Expo · React Native</text>
  <text class="detail" x="455" y="270" text-anchor="middle">Exibe e envia informações</text>

  <rect class="box backend" x="650" y="160" width="240" height="150"/>
  <text class="name" x="770" y="216" text-anchor="middle">Backend · API</text>
  <text class="detail" x="770" y="248" text-anchor="middle">Valida e aplica</text>
  <text class="detail" x="770" y="270" text-anchor="middle">as regras do sistema</text>

  <rect class="box database" x="970" y="160" width="190" height="150"/>
  <text class="name" x="1065" y="216" text-anchor="middle">Banco de dados</text>
  <text class="detail" x="1065" y="248" text-anchor="middle">SQLite</text>
  <text class="detail" x="1065" y="270" text-anchor="middle">Guarda as informações</text>

  <path class="arrow" d="M260 218 H334" marker-end="url(#arrow)"/>
  <path class="arrow" d="M570 218 H644" marker-end="url(#arrow)"/>
  <path class="arrow" d="M890 218 H964" marker-end="url(#arrow)"/>
  <text class="arrow-label" x="302" y="198" text-anchor="middle">interação</text>
  <text class="arrow-label" x="607" y="198" text-anchor="middle">HTTP / JSON</text>
  <text class="arrow-label" x="927" y="198" text-anchor="middle">consulta e grava</text>

  <path class="arrow" d="M650 280 H570" marker-end="url(#arrow)" marker-start="url(#arrow-start)"/>
  <text class="arrow-label" x="610" y="305" text-anchor="middle">resposta</text>
</svg>
