<svg xmlns="http://www.w3.org/2000/svg" width="1680" height="1080" viewBox="0 0 1680 1080" role="img" aria-labelledby="title description">
  <title id="title">Arquitetura atual do AICare</title>
  <desc id="description">Arquitetura do aplicativo Expo e React Native, cliente HTTP, API FastAPI organizada em controllers, services e repositories, e persistência SQLite. O aplicativo é executado no Expo Go e se comunica com a API pela rede local.</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", Arial, sans-serif; }
      .page { fill: #f3f6f8; }
      .masthead { fill: #19384c; }
      .masthead-accent { fill: #58a69e; }
      .title { fill: #f7fafc; font-size: 29px; font-weight: 650; }
      .subtitle { fill: #c4d2dc; font-size: 14px; }
      .zone { fill: #fff; stroke: #d8e1e7; stroke-width: 1.4; }
      .zone-title { fill: #263f50; font-size: 19px; font-weight: 650; }
      .zone-subtitle { fill: #71818d; font-size: 12px; }
      .client { fill: #f7fbfd; stroke: #c5d8e4; stroke-width: 1.4; }
      .server { fill: #f8fbf8; stroke: #cadbcf; stroke-width: 1.4; }
      .store { fill: #fffaf1; stroke: #e2d3b1; stroke-width: 1.4; }
      .muted-box { fill: #f6f8f9; stroke: #d5dee4; stroke-width: 1.2; }
      .box-title { fill: #2d4d65; font-size: 16px; font-weight: 650; }
      .body { fill: #3f5362; font-size: 13px; }
      .small { fill: #71808b; font-size: 12px; }
      .arrow { fill: none; stroke: #527a95; stroke-width: 2.1; }
      .divider { stroke: #dce5ea; stroke-width: 1; }
      .tag { fill: #71818d; font-size: 10px; font-weight: 650; letter-spacing: 1.1px; }
      .note-title { fill: #40596b; font-size: 13px; font-weight: 650; }
      .note { fill: #647686; font-size: 12px; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#547b96" stroke-width="1.4"/>
    </marker>
    <marker id="local-arrowhead" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M1 1 L7 4 L1 7" fill="none" stroke="#a27b3f" stroke-width="1.3"/>
    </marker>
  </defs>

  <rect class="page" width="1680" height="1080"/>
  <rect class="masthead" width="1680" height="124"/>
  <rect class="masthead-accent" y="120" width="1680" height="4"/>
  <text class="title" x="64" y="57">Arquitetura do sistema</text>
  <text class="subtitle" x="66" y="88">Aplicativo móvel · API · persistência</text>

  <!-- Aplicação cliente -->
  <g>
    <rect class="zone" x="52" y="142" width="460" height="778" rx="12"/>
    <text class="zone-title" x="78" y="181">Aplicativo móvel</text>
    <text class="zone-subtitle" x="78" y="203">Expo · React Native · Expo Router</text>

    <rect class="client" x="78" y="232" width="408" height="272" rx="9"/>
    <text class="tag" x="100" y="258">TELAS E FUNCIONALIDADES</text>
    <text class="box-title" x="100" y="286">Interface do aplicativo</text>
    <line class="divider" x1="100" y1="300" x2="464" y2="300"/>
    <text class="body" x="100" y="330">Entrar e criar conta</text>
    <text class="body" x="100" y="357">Início e cadastro do paciente</text>
    <text class="body" x="100" y="384">Diário de cuidados e fotos</text>
    <text class="body" x="100" y="411">Medicamentos, doses e estoque</text>
    <text class="body" x="100" y="438">Familiares, convites e assistente</text>
    <text class="small" x="100" y="478">Contextos: autenticação, paciente e medicamentos</text>

    <rect class="client" x="78" y="536" width="408" height="152" rx="9"/>
    <text class="tag" x="100" y="562">COMUNICAÇÃO</text>
    <text class="box-title" x="100" y="590">Cliente da API (api.ts)</text>
    <line class="divider" x1="100" y1="603" x2="464" y2="603"/>
    <text class="body" x="100" y="630">Requisições REST com JSON</text>
    <text class="body" x="100" y="654">Token de sessão no cabeçalho Bearer</text>
    <text class="small" x="100" y="676">A URL usa o host do servidor Expo na rede local</text>

    <rect class="store" x="78" y="720" width="408" height="148" rx="9"/>
    <text class="tag" x="100" y="746">NO DISPOSITIVO</text>
    <text class="box-title" x="100" y="774">AsyncStorage</text>
    <line class="divider" x1="100" y1="787" x2="464" y2="787"/>
    <text class="body" x="100" y="814">Token de autenticação</text>
    <text class="small" x="100" y="842">Estado principal e registros são obtidos da API</text>
  </g>

  <!-- Backend -->
  <g>
    <rect class="zone" x="588" y="142" width="680" height="778" rx="12"/>
    <text class="zone-title" x="614" y="181">Backend</text>
    <text class="zone-subtitle" x="614" y="203">Python · FastAPI · Pydantic</text>

    <rect class="server" x="614" y="232" width="628" height="126" rx="9"/>
    <text class="tag" x="638" y="258">ENTRADA HTTP</text>
    <text class="box-title" x="638" y="287">API REST</text>
    <line class="divider" x1="638" y1="300" x2="1218" y2="300"/>
    <text class="body" x="638" y="328">Validação de dados · autenticação · CORS · logs · /health</text>
    <text class="small" x="638" y="348">Documentação interativa em /docs</text>

    <rect class="server" x="614" y="392" width="628" height="139" rx="9"/>
    <text class="tag" x="638" y="418">ROTAS E CONTROLLERS</text>
    <text class="box-title" x="638" y="447">Camada HTTP</text>
    <line class="divider" x1="638" y1="460" x2="1218" y2="460"/>
    <text class="body" x="638" y="488">Auth · Patient · Invite · Diary · Medication</text>
    <text class="body" x="638" y="512">Medication Assistant</text>

    <rect class="server" x="614" y="565" width="628" height="139" rx="9"/>
    <text class="tag" x="638" y="591">REGRAS DE NEGÓCIO</text>
    <text class="box-title" x="638" y="620">Services</text>
    <line class="divider" x1="638" y1="633" x2="1218" y2="633"/>
    <text class="body" x="638" y="661">Autenticação · paciente · convites · diário</text>
    <text class="body" x="638" y="685">Medicamentos, doses, estoque e assistente</text>

    <rect class="server" x="614" y="738" width="628" height="130" rx="9"/>
    <text class="tag" x="638" y="764">ACESSO A DADOS</text>
    <text class="box-title" x="638" y="793">Repositories</text>
    <line class="divider" x1="638" y1="806" x2="1218" y2="806"/>
    <text class="body" x="638" y="834">Auth · Patient · Invite · Diary · Medication</text>
    <text class="small" x="638" y="856">Persistência e consultas implementadas com sqlite3</text>
  </g>

  <!-- Persistência -->
  <g>
    <rect class="zone" x="1344" y="142" width="284" height="778" rx="12"/>
    <text class="zone-title" x="1370" y="181">Persistência</text>
    <text class="zone-subtitle" x="1370" y="203">Arquivo local</text>

    <rect class="store" x="1370" y="302" width="232" height="292" rx="9"/>
    <text class="tag" x="1390" y="329">BANCO DE DADOS</text>
    <text class="box-title" x="1390" y="360">SQLite</text>
    <line class="divider" x1="1390" y1="374" x2="1582" y2="374"/>
    <text class="body" x="1390" y="402">family_members</text>
    <text class="body" x="1390" y="427">sessions</text>
    <text class="body" x="1390" y="452">patients · invites</text>
    <text class="body" x="1390" y="477">diary_records</text>
    <text class="body" x="1390" y="502">medications</text>
    <text class="body" x="1390" y="527">dose_records</text>
    <text class="body" x="1390" y="552">inventory_movements</text>
    <text class="small" x="1390" y="578">Conteúdo de registros em JSON</text>

    <rect class="muted-box" x="1370" y="650" width="232" height="126" rx="9"/>
    <text class="note-title" x="1390" y="680">Arquivo de dados</text>
    <text class="note" x="1390" y="708">backend\data\</text>
    <text class="note" x="1390" y="730">aicare.sqlite3</text>
    <text class="small" x="1390" y="758">Criado na primeira inicialização</text>
  </g>

  <!-- Fluxos principais -->
  <path class="arrow" d="M486 608 H548 V295 H614" marker-end="url(#arrowhead)"/>
  <rect x="510" y="427" width="92" height="24" rx="5" fill="#f5f7fa"/>
  <text class="small" x="556" y="444" text-anchor="middle">HTTP / JSON</text>
  <path class="arrow" d="M928 358 V392" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M928 531 V565" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M928 704 V738" marker-end="url(#arrowhead)"/>
  <path class="arrow" d="M1242 803 H1370" marker-start="url(#arrowhead)" marker-end="url(#arrowhead)"/>

</svg>
